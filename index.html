<style>
  :root {
    --m-light: #81C4FF;
    --m-dark: #0066B1;
    --m-red: #E7222E;
    --am-red: #D90012;    /* Armenian flag */
    --am-blue: #0033A0;
    --am-orange: #F2A800;
    --bg: #0a0a0b;
    --text: #ffffff;
    --t: .9s; /* when the title starts (after the stripe wipe) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  /* ---------- top stripe ---------- */
  .top-stripes { position: fixed; top: 0; left: 0; right: 0; height: 8px; display: flex; z-index: 5; }
  .top-stripes span { flex: 1; animation: shine 3s ease-in-out infinite; }
  .top-stripes span:nth-child(1) { background: var(--m-light); }
  .top-stripes span:nth-child(2) { background: var(--m-dark); animation-delay: .3s; }
  .top-stripes span:nth-child(3) { background: var(--m-red);  animation-delay: .6s; }

  /* ---------- hero ---------- */
  .hero {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px 96px;
    position: relative;
  }
  h1 {
    font-size: clamp(1.8rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: 0.04em;
    font-style: italic;
    line-height: 1.25;
    animation: rise 1s cubic-bezier(.2,.8,.2,1) var(--t) both;
  }
  h1 span { display: block; }
  h1 i { display: inline-block; font-style: italic; animation: slashIn .6s ease-out both, pulse 2.4s ease-in-out infinite; }
  .s1 { color: var(--m-light); animation-delay: calc(var(--t) + .3s),  calc(var(--t) + 1.6s); }
  .s2 { color: var(--m-dark);  animation-delay: calc(var(--t) + .45s), calc(var(--t) + 1.9s); }
  .s3 { color: var(--m-red);   animation-delay: calc(var(--t) + .6s),  calc(var(--t) + 2.2s); }

  /* stripe under the title: Armenian flag colors */
  .line {
    width: 120px; height: 4px; margin: 26px auto 0;
    background: linear-gradient(90deg, var(--am-red) 33.33%, var(--am-blue) 33.33% 66.66%, var(--am-orange) 66.66%);
    transform: skewX(-20deg);
    animation: grow 1s calc(var(--t) + .8s) cubic-bezier(.2,.8,.2,1) both;
  }

  /* ---------- services ---------- */
  .services { list-style: none; margin-top: 34px; display: flex; flex-direction: column; gap: 12px; }
  .services li {
    font-size: clamp(.95rem, 2.6vw, 1.15rem); letter-spacing: .06em; color: #d6d6da;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  .services li:first-child { font-weight: 700; color: #fff; font-size: clamp(1.05rem, 3vw, 1.3rem); }
  .services .ic { display: inline-block; width: 1.9em; }
  .services li:nth-child(1) { animation-delay: calc(var(--t) + 1.0s); }
  .services li:nth-child(2) { animation-delay: calc(var(--t) + 1.12s); }
  .services li:nth-child(3) { animation-delay: calc(var(--t) + 1.24s); }
  .services li:nth-child(4) { animation-delay: calc(var(--t) + 1.36s); }
  .services li:nth-child(5) { animation-delay: calc(var(--t) + 1.48s); }

  /* ---------- social icons ---------- */
  .social { display: flex; justify-content: center; gap: 18px; margin-top: 34px; }
  .social a {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; text-decoration: none;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.04);
    transition: transform .25s, color .25s, border-color .25s, box-shadow .25s;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  .social a:nth-child(1) { animation-delay: calc(var(--t) + 1.8s); }
  .social a:nth-child(2) { animation-delay: calc(var(--t) + 1.95s); }
  .social a:nth-child(3) { animation-delay: calc(var(--t) + 2.1s); }
  .social a:hover, .social a:focus-visible {
    transform: translateY(-4px);
    color: var(--m-light); border-color: var(--m-light);
    box-shadow: 0 0 18px rgba(129,196,255,.35);
    outline: none;
  }
  .social svg { width: 24px; height: 24px; }
  .social a:nth-child(2) svg { width: 32px; height: 32px; }

  .down {
    position: absolute; bottom: 28px; left: 50%; margin-left: -14px;
    width: 28px; height: 28px; color: rgba(255,255,255,.55);
    animation: rise .8s calc(var(--t) + 2.4s) both, bob 2s ease-in-out calc(var(--t) + 3.2s) infinite;
  }
  .down svg { width: 100%; height: 100%; }

  /* ---------- location ---------- */
  .location { padding: 24px 24px 80px; max-width: 980px; margin: 0 auto; }
  .location h2 {
    font-size: .85rem; font-weight: 700; letter-spacing: .4em; text-transform: uppercase;
    color: var(--m-light); margin-bottom: 22px;
  }
  .mapbox {
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    background: #141416;
  }
  .mapbox::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 1;
    background: linear-gradient(90deg, var(--m-light) 33.33%, var(--m-dark) 33.33% 66.66%, var(--m-red) 66.66%);
  }
  .mapbox iframe { display: block; width: 100%; height: 420px; border: 0; }
  .btns { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
  .btns a {
    color: #fff; text-decoration: none; font-size: .8rem; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    padding: 13px 22px; border: 1px solid rgba(255,255,255,.28);
    transition: border-color .25s, color .25s, background .25s;
  }
  .btns a:hover, .btns a:focus-visible { border-color: var(--m-light); color: var(--m-light); background: rgba(129,196,255,.08); outline: none; }
  .coords { margin-top: 18px; font-size: .75rem; letter-spacing: .15em; color: #8a8a90; }

  /* ---------- intro: M-stripe wipe ---------- */
  .wipe span {
    position: fixed; top: -10%; bottom: -10%; left: 0; width: 16vw; z-index: 11;
    transform: translateX(-60vw) skewX(-20deg);
    animation: sweep .8s cubic-bezier(.6,0,.3,1) forwards;
    pointer-events: none;
  }
  .wipe span:nth-child(1) { background: var(--m-light); animation-delay: .20s; }
  .wipe span:nth-child(2) { background: var(--m-dark);  animation-delay: .28s; }
  .wipe span:nth-child(3) { background: var(--m-red);   animation-delay: .36s; }

  /* ---------- keyframes ---------- */
  @keyframes sweep { from { transform: translateX(-60vw) skewX(-20deg); } to { transform: translateX(180vw) skewX(-20deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes slashIn { from { opacity: 0; transform: translateX(-24px) skewX(-20deg); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.6) drop-shadow(0 0 8px currentColor); } }
  @keyframes grow { from { width: 0; opacity: 0; } to { width: 120px; opacity: 1; } }
  @keyframes shine { 0%,100% { filter: brightness(.8); } 50% { filter: brightness(1.5); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }

  @media (max-width: 600px) {
    .social { gap: 14px; }
    .mapbox iframe { height: 340px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .wipe { display: none; }
    *, *::before { animation: none !important; }
  }
</style>
